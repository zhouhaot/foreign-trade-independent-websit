<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Form - TradePlus Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0f1923; color: #e0e0e0; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #1a2744; padding: 24px 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar .logo { color: #fff; font-size: 22px; font-weight: 700; padding: 0 24px 24px;
                         border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
        .sidebar a { display: block; color: rgba(255,255,255,0.6); text-decoration: none;
                     padding: 12px 24px; transition: all 0.2s; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { color: #4a9eff; background: rgba(74,158,255,0.08); }
        .main { flex: 1; padding: 32px; }
        .header { margin-bottom: 32px; }
        .header h1 { color: #fff; font-size: 24px; }
        .form-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
                     border-radius: 12px; padding: 32px; max-width: 900px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.7); margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #4a9eff; }
        .form-group textarea { min-height: 200px; resize: vertical; line-height: 1.6; }
        .form-group select option { background: #1a2744; color: #fff; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none;
               font-size: 14px; font-weight: 500; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #4a9eff, #2b7de9); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.15); }
        .form-actions { display: flex; gap: 12px; margin-top: 24px; }
        .image-preview { margin-top: 8px; }
        .image-preview img { max-width: 200px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="logo">TradePlus</div>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products">Products</a>
            <a href="/admin/categories">Categories</a>
            <a href="/admin/inquiries">Inquiries</a>
            <a href="/admin/articles" class="active">Articles</a>
            <a href="/admin/banners">Banners</a>
        </nav>
        <div class="main">
            <div class="header">
                <h1 th:text="${article.id != null} ? 'Edit Article' : 'Add Article'">Article Form</h1>
            </div>
            <div class="form-card">
                <form th:action="@{/admin/articles/save}" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="id" th:value="${article.id}">

                    <div class="form-row">
                        <div class="form-group">
                            <label>Title (Chinese)</label>
                            <input type="text" name="titleCn" th:value="${article.titleCn}" required>
                        </div>
                        <div class="form-group">
                            <label>Title (English)</label>
                            <input type="text" name="titleEn" th:value="${article.titleEn}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Content (Chinese) - Supports Markdown</label>
                        <textarea name="contentCn" th:text="${article.contentCn}" placeholder="Write article content in Chinese..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Content (English) - Supports Markdown</label>
                        <textarea name="contentEn" th:text="${article.contentEn}" placeholder="Write article content in English..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Cover Image</label>
                            <input type="file" name="imageFile" accept="image/*">
                            <div class="image-preview" th:if="${article.coverImage != null}">
                                <img th:src="${article.coverImage}" alt="Cover">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select name="status">
                                <option value="1" th:selected="${article.status == 1}">Published</option>
                                <option value="0" th:selected="${article.status == 0}">Draft</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Article</button>
                        <a href="/admin/articles" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
