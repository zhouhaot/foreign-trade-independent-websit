<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePlus Admin - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #0c1426 0%, #1a2744 50%, #0c1426 100%);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
                     border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
                     padding: 48px; width: 400px; }
        .login-box h1 { color: #fff; font-size: 28px; margin-bottom: 8px; text-align: center; }
        .login-box p { color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.7); margin-bottom: 8px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05);
                           border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
                           color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #4a9eff; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #4a9eff, #2b7de9);
                     border: none; border-radius: 8px; color: #fff; font-size: 16px;
                     font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(74,158,255,0.4); }
        .error-msg { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3);
                     color: #ff4757; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .logout-msg { background: rgba(46,213,115,0.1); border: 1px solid rgba(46,213,115,0.3);
                      color: #2ed573; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>TradePlus</h1>
        <p>Admin Dashboard</p>

        <div th:if="${param.error}" class="error-msg">Invalid username or password</div>
        <div th:if="${param.logout}" class="logout-msg">You have been logged out</div>

        <form th:action="@{/admin/login}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
