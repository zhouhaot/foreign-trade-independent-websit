<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - TradePlus Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0f1923; color: #e0e0e0; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #1a2744; padding: 24px 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar .logo { color: #fff; font-size: 22px; font-weight: 700; padding: 0 24px 24px;
                         border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
        .sidebar a { display: block; color: rgba(255,255,255,0.6); text-decoration: none;
                     padding: 12px 24px; transition: all 0.2s; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { color: #4a9eff; background: rgba(74,158,255,0.08); }
        .main { flex: 1; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { color: #fff; font-size: 24px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none;
               font-size: 14px; font-weight: 500; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #4a9eff, #2b7de9); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(74,158,255,0.4); }
        .btn-danger { background: rgba(255,71,87,0.15); color: #ff4757; border: 1px solid rgba(255,71,87,0.3); }
        .btn-danger:hover { background: rgba(255,71,87,0.25); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
        th { color: rgba(255,255,255,0.4); font-size: 13px; font-weight: 500; text-transform: uppercase; }
        td { color: #e0e0e0; font-size: 14px; }
        .table-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
                      border-radius: 12px; overflow: hidden; }
        .success-msg { background: rgba(46,213,115,0.1); border: 1px solid rgba(46,213,115,0.3);
                       color: #2ed573; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
        .actions { display: flex; gap: 8px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-active { background: rgba(46,213,115,0.15); color: #2ed573; }
        .status-inactive { background: rgba(255,71,87,0.15); color: #ff4757; }
        .product-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
                         background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="logo">TradePlus</div>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products" class="active">Products</a>
            <a href="/admin/categories">Categories</a>
            <a href="/admin/inquiries">Inquiries</a>
        </nav>
        <div class="main">
            <div class="header">
                <h1>Products</h1>
                <a href="/admin/products/add" class="btn btn-primary">+ Add Product</a>
            </div>
            <div th:if="${success}" class="success-msg" th:text="${success}"></div>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prod : ${products}">
                            <td>
                                <img th:src="${prod.mainImage != null} ? ${prod.mainImage} : '/uploads/placeholder.png'"
                                     class="product-thumb" alt="product">
                            </td>
                            <td>
                                <div th:text="${prod.nameCn}" style="color:#fff; font-weight:500;"></div>
                                <div th:text="${prod.nameEn}" style="color:rgba(255,255,255,0.4); font-size:12px;"></div>
                            </td>
                            <td th:text="${prod.categoryName}">-</td>
                            <td th:text="${prod.price}">-</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${prod.status == 1} ? 'status-active' : 'status-inactive'"
                                      th:text="${prod.status == 1} ? 'Active' : 'Inactive'">Active</span>
                            </td>
                            <td>
                                <div class="actions">
                                    <a th:href="@{'/admin/products/edit/' + ${prod.id}}" class="btn btn-primary btn-sm">Edit</a>
                                    <form th:action="@{'/admin/products/delete/' + ${prod.id}}" method="post" style="display:inline"
                                          onsubmit="return confirm('Are you sure?')">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
