<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TradePlus Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0f1923; color: #e0e0e0; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #1a2744; padding: 24px 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar .logo { color: #fff; font-size: 22px; font-weight: 700; padding: 0 24px 24px;
                         border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
        .sidebar a { display: block; color: rgba(255,255,255,0.6); text-decoration: none;
                     padding: 12px 24px; transition: all 0.2s; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { color: #4a9eff; background: rgba(74,158,255,0.08); }
        .main { flex: 1; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { color: #fff; font-size: 24px; }
        .header .logout { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; }
        .header .logout:hover { color: #ff4757; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
                     border-radius: 12px; padding: 24px; }
        .stat-card .label { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 8px; }
        .stat-card .value { color: #fff; font-size: 32px; font-weight: 700; }
        .stat-card .value.unread { color: #ff6b6b; }
        .content { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
                   border-radius: 12px; padding: 24px; }
        .content h2 { color: #fff; font-size: 18px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="logo">TradePlus</div>
            <a href="/admin/dashboard" class="active">Dashboard</a>
            <a href="/admin/products">Products</a>
            <a href="/admin/categories">Categories</a>
            <a href="/admin/inquiries">Inquiries</a>
        </nav>
        <div class="main">
            <div class="header">
                <h1>Dashboard</h1>
                <a href="/admin/logout" class="logout">Logout</a>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="label">Total Products</div>
                    <div class="value" th:text="${productCount}">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Categories</div>
                    <div class="value" th:text="${categoryCount}">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Total Inquiries</div>
                    <div class="value" th:text="${inquiryCount}">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Unread Inquiries</div>
                    <div class="value unread" th:text="${unreadCount}">0</div>
                </div>
            </div>
            <div class="content">
                <h2>Quick Actions</h2>
                <p style="color: rgba(255,255,255,0.5);">
                    <a href="/admin/products/add" style="color: #4a9eff;">Add New Product</a> |
                    <a href="/admin/inquiries" style="color: #4a9eff;">View Inquiries</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
