<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiries - TradePlus Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0f1923; color: #e0e0e0; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #1a2744; padding: 24px 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar .logo { color: #fff; font-size: 22px; font-weight: 700; padding: 0 24px 24px;
                         border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
        .sidebar a { display: block; color: rgba(255,255,255,0.6); text-decoration: none;
                     padding: 12px 24px; transition: all 0.2s; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { color: #4a9eff; background: rgba(74,158,255,0.08); }
        .main { flex: 1; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { color: #fff; font-size: 24px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none;
               font-size: 14px; font-weight: 500; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-danger { background: rgba(255,71,87,0.15); color: #ff4757; border: 1px solid rgba(255,71,87,0.3); }
        .btn-danger:hover { background: rgba(255,71,87,0.25); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
        th { color: rgba(255,255,255,0.4); font-size: 13px; font-weight: 500; text-transform: uppercase; }
        td { color: #e0e0e0; font-size: 14px; }
        .table-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
                      border-radius: 12px; overflow: hidden; }
        .success-msg { background: rgba(46,213,115,0.1); border: 1px solid rgba(46,213,115,0.3);
                       color: #2ed573; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
        .actions { display: flex; gap: 8px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-unread { background: rgba(255,107,107,0.15); color: #ff6b6b; }
        .badge-read { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); }
        .row-unread { background: rgba(255,107,107,0.03); }
        .msg-preview { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                       color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="logo">TradePlus</div>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/products">Products</a>
            <a href="/admin/categories">Categories</a>
            <a href="/admin/inquiries" class="active">Inquiries</a>
        </nav>
        <div class="main">
            <div class="header">
                <h1>Inquiries</h1>
            </div>
            <div th:if="${success}" class="success-msg" th:text="${success}"></div>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Contact</th>
                            <th>Company</th>
                            <th>Product</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inq : ${inquiries}" th:classappend="${inq.isRead == 0} ? 'row-unread' : ''">
                            <td th:text="${inq.id}">1</td>
                            <td>
                                <div th:text="${inq.contactName}" style="color:#fff; font-weight:500;"></div>
                                <div th:text="${inq.email}" style="color:rgba(255,255,255,0.4); font-size:12px;"></div>
                            </td>
                            <td th:text="${inq.companyName}">-</td>
                            <td th:text="${inq.productName}">-</td>
                            <td><div class="msg-preview" th:text="${inq.message}">Message...</div></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${inq.isRead == 0} ? 'badge-unread' : 'badge-read'"
                                      th:text="${inq.isRead == 0} ? 'Unread' : 'Read'">Status</span>
                            </td>
                            <td th:text="${#temporals.format(inq.createTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                            <td>
                                <div class="actions">
                                    <a th:href="@{'/admin/inquiries/' + ${inq.id}}" class="btn btn-primary btn-sm">View</a>
                                    <form th:action="@{'/admin/inquiries/delete/' + ${inq.id}}" method="post" style="display:inline"
                                          onsubmit="return confirm('Delete this inquiry?')">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
