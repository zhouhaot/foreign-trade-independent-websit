<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0f1923"/><stop offset="100%" style="stop-color:#1a2744"/></linearGradient></defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Handshake illustration -->
  <rect x="50" y="80" width="300" height="240" rx="16" fill="#1e3a5f" stroke="#2a4a6f" stroke-width="1.5"/>
  <rect x="70" y="110" width="260" height="160" rx="10" fill="#0f1923"/>
  <!-- European map outline (simplified) -->
  <rect x="100" y="130" width="80" height="60" rx="8" fill="#2b7de9" opacity="0.15"/>
  <rect x="190" y="125" width="70" height="55" rx="8" fill="#2b7de9" opacity="0.2"/>
  <rect x="150" y="155" width="50" height="40" rx="6" fill="#2b7de9" opacity="0.25"/>
  <!-- Connection lines -->
  <line x1="200" y1="140" x2="260" y2="180" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="180" x2="270" y2="140" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
  <!-- Right text -->
  <text x="560" y="140" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="bold">European Market</text>
  <text x="560" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="bold">Partnership</text>
  <text x="560" y="230" text-anchor="middle" fill="#4a9eff" font-family="Arial" font-size="18">Pan-European Distribution Network</text>
  <text x="400" y="360" text-anchor="middle" fill="#556677" font-family="Arial" font-size="16">TradePlus Global</text>
</svg>