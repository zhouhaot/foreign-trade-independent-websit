  <text x="200" y="75" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">TradePlus</text>
  <!-- Right text -->
  <text x="560" y="150" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="bold">TradePlus at</text>
  <text x="560" y="190" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="bold">Global FinTech Expo</text>
  <text x="560" y="240" text-anchor="middle" fill="#4a9eff" font-family="Arial" font-size="18">Hong Kong 2024</text>
  <text x="400" y="360" text-anchor="middle" fill="#556677" font-family="Arial" font-size="16">TradePlus Events</text>
</svg>