<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0f1923"/><stop offset="100%" style="stop-color:#1a2744"/></linearGradient></defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Exhibition Booth -->
  <rect x="50" y="80" width="300" height="240" rx="12" fill="#1e3a5f" stroke="#2a4a6f" stroke-width="1.5"/>
  <rect x="70" y="110" width="120" height="80" rx="6" fill="#0f1923"/>
  <rect x="85" y="120" width="90" height="60" rx="4" fill="#2b7de9" opacity="0.25"/>
  <text x="130" y="156" text-anchor="middle" fill="#4a9eff" font-family="Arial" font-size="20" font-weight="bold">Expo</text>
  <rect x="210" y="110" width="120" height="80" rx="6" fill="#0f1923"/>
  <rect x="225" y="125" width="40" height="50" rx="4" fill="#2b7de9" opacity="0.2"/>
  <rect x="275" y="125" width="40" height="50" rx="4" fill="#2b7de9" opacity="0.15"/>
