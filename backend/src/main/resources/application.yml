spring:
  application:
    name: TradePlus

  # SQLite Database
  datasource:
    url: jdbc:sqlite:tradeplus.db
    driver-class-name: org.sqlite.JDBC

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/

  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # SQL Init
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # Mail Configuration
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-smtp-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis (top-level, NOT under spring)
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Server
server:
  port: 8080

# File storage
app:
  upload-dir: ./uploads
  # Admin email for receiving inquiry notifications
  admin-email: your-email@qq.com
  # JWT secret for admin API
  jwt-secret: TradePlusSecretKey2024ForAdminApiJWT
